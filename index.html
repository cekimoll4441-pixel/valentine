<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Heart Particle Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <script>
        // 1. Three.js Səhnəsinin Qurulması (Scene, Camera, Renderer)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Ürək Formasının Riyazi Olaraq Yaradılması (SVG Path məntiqi əvəzinə birbaşa riyazi formul)
        const vertices = [];
        const totalParticles = 1500; // Hissəcik sayı

        // Şəkildəki GSAP animasiya zamanlaması üçün timeline
        const tl = gsap.timeline({
            repeat: -1,
            yoyo: true
        });

        // Ürəyin 3D koordinatlarını hesablamaq üçün funksiya
        function getHeartPoint(t) {
            // Riyazi ürək formulu (Parametrik)
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * 0.8, y: y * 0.8 }; // 0.8 ölçünü tənzimləmək üçündür
        }

        // Hissəciklərin həndəsi strukturunu yaradırıq
        const geometry = new THREE.BufferGeometry();
        const positions = [];

        for (let i = 0; i < totalParticles; i++) {
            // 0 ilə 2*PI arasında təsadüfi bucaq
            const t = Math.random() * Math.PI * 2;
            const point = getHeartPoint(t);

            // Şəkildəki kodun eynisi: Vector3 yaradılır və təsadüfi dağılma (randomness) əlavə edilir
            const vector = new THREE.Vector3(point.x, point.y, 0);
            
            // Şəkildəki kimi random yayılma effektləri
            vector.x += (Math.random() - 0.5) * 2;
            vector.y += (Math.random() - 0.5) * 2;
            vector.z += (Math.random() - 0.5) * 5;

            positions.push(vector.x, vector.y, vector.z);
            vertices.push(vector); // GSAP animasiyası üçün massivdə saxlayırıq

            // Şəkildəki GSAP Animasiya Bloku:
            tl.from(vector, {
                x: 0, // Mərkəzdən başlasın (Şəkildə: 600 / 2)
                y: 0, // Mərkəzdən başlasın (Şəkildə: -552 / 2)
                z: 0,
                ease: "power2.inOut",
                duration: gsap.utils.random(2, 5), // Təsadüfi müddət
            }, i * 0.002); // Hər nöqtə üçün gecikmə (delay)
        }

        // Mövqeləri həndəsəyə ötürürük
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

        // Hissəciklərin vizual görünüşü (Çəhrayı/Qırmızı rəngli ulduzlar kimi)
        const material = new THREE.PointsMaterial({
            color: 0xff4d6d, // Şəkildəki kimi gözəl çəhrayı-qırmızı ton
            size: 0.3,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // 3. Animasiya Dövrü (Render Loop)
        function animate() {
            requestAnimationFrame(animate);

            // GSAP obyektlərin dəyərlərini (vector) dəyişdiyi üçün hər freymdə mövqeləri yeniləməliyik
            const positionAttribute = geometry.getAttribute('position');
            for (let i = 0; i < vertices.length; i++) {
                positionAttribute.setXYZ(i, vertices[i].x, vertices[i].y, vertices[i].z);
            }
            positionAttribute.needsUpdate = true;

            // Ürəyin yavaşca fırlanması üçün (vizual effekti artırır)
            particleSystem.rotation.y += 0.002;

            renderer.render(scene, camera);
        }

        // Ekran ölçüsü dəyişəndə uyğunlaşma (Responsive)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
